services:
  - type: web
    name: portfolioiq
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: REPORT_EMAIL
        value: rinjoque@me.com
      - key: SMTP_SERVER
        value: smtp.mail.me.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
